<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LiveChat</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <section id="login-screen" class="screen">
    <div class="login-card">
      <h1>LiveChat</h1>
      <p>Masukkan nama panggilan untuk mulai mengobrol.</p>
      <input id="nickname-input" type="text" placeholder="Nama panggilan" maxlength="24" autocomplete="off" />
      <button id="login-btn">Masuk</button>
      <p id="login-error" class="error hidden"></p>
    </div>
  </section>

  <section id="app-screen" class="screen hidden">
    <aside id="sidebar">
      <div class="sidebar-header">
        <span>Masuk sebagai <strong id="my-nickname"></strong></span>
      </div>
      <ul id="user-list"></ul>
    </aside>

    <main id="chat-panel">
      <header id="chat-header">Pilih seseorang untuk mulai chat</header>
      <div id="messages"></div>
      <form id="message-form" class="hidden">
        <input id="message-input" type="text" placeholder="Tulis pesan..." autocomplete="off" />
        <button type="submit">Kirim</button>
      </form>
    </main>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
