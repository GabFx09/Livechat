<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customer Service</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <section id="login-screen" class="screen">
    <div class="login-card">
      <h1>Customer Service</h1>
      <p>Masukkan nama Anda untuk mulai chat dengan tim kami.</p>
      <input id="name-input" type="text" placeholder="Nama Anda" maxlength="40" autocomplete="off" />
      <button id="start-btn">Mulai Chat</button>
      <p id="start-error" class="error hidden"></p>
    </div>
  </section>

  <section id="chat-screen" class="screen hidden">
    <div class="chat-container">
      <header id="chat-header">Customer Service</header>
      <div id="messages"></div>
      <form id="message-form">
        <input id="message-input" type="text" placeholder="Tulis pesan..." autocomplete="off" />
        <button type="submit">Kirim</button>
      </form>
    </div>
  </section>

  <script type="module" src="js/customer.js"></script>
</body>
</html>
